# schematize-rust — workflow de CI de referência (§13, §21, a `schematize-qa`, §35).
# Copie para .github/workflows/ci.yml e ajuste <projeto>/comandos da sua stack.
name: ci
on:
  pull_request:
  push: { branches: [main] }

jobs:
  standards-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - name: Gate de padrões (DoD/§37) no diff
        run: bash .claude/skills/schematize-rust/scripts/check-diff.sh "origin/${{ github.base_ref || 'main' }}"
      - name: Índice de microfunções atualizado (§39)
        env:
          # Sem estes dois o gate NAO roda — e nao rodar REPROVA. Gate desarmado em silencio
          # ("|| true" + diff comentado) foi o achado A5 da vistoria de 2026-08-21.
          INDEX_SRC: ${{ vars.INDEX_SRC || './internal' }}
          INDEX_FILE: ${{ vars.INDEX_FILE }}
        run: bash .claude/skills/schematize-rust/scripts/check-index.sh
      - name: Scan de segredo no archive (§16.1/§32)
        run: bash .claude/skills/schematize-rust/scripts/archive-secret-scan.sh .

  test-kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Smoke + security + authz + hardening (PR — a `schematize-qa` (gates de CI, `references/execucao.md` secao 6))
        run: |
          # <projeto> test smoke && <projeto> test security && <projeto> test authz && <projeto> test hardening
          echo "ligue ao CLI <projeto>_ops aqui"
      - name: Smoke self-check (anti verde-mentiroso — a `schematize-qa` (smoke e matriz simulated, `references/categorias.md` secoes 5 e 10))
        run: bash .claude/skills/schematize-rust/scripts/smoke-selfcheck.sh --self-check

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Trivy fs
        uses: aquasecurity/trivy-action@master
        with: { scan-type: fs, severity: HIGH,CRITICAL, exit-code: '1' }
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
